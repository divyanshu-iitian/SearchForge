name: Publish MCP Server

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v prefix
        required: true
        default: "0.2.0"

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish OCI image and registry metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASE_TAG:-$INPUT_VERSION}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release metadata
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "$(jq -r .version package.json)" = "$VERSION"
          jq --arg version "$VERSION" \
            '.version = $version | .packages[0].identifier = "ghcr.io/divyanshu-iitian/searchforge-mcp:" + $version' \
            server.json > server.publish.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mcp
          push: true
          tags: |
            ghcr.io/divyanshu-iitian/searchforge-mcp:${{ steps.version.outputs.value }}
            ghcr.io/divyanshu-iitian/searchforge-mcp:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.modelcontextprotocol.server.name=io.github.divyanshu-iitian/searchforge

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" |
            tar xz mcp-publisher

      - name: Publish to official MCP Registry
        run: |
          mv server.publish.json server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
